name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run setup
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: SHA-256 dos instaladores
        shell: bash
        run: |
          shopt -s nullglob
          cd release
          sha256sum *.exe *.AppImage | tee "SHA256SUMS-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: darkpages-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/SHA256SUMS-*.txt
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
      - name: Anexar à release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" --title "Darkpages ${{ github.ref_name }}" --notes "Instaladores automáticos. Sem assinatura digital: no Windows, clique em Mais informações e depois em Executar assim mesmo." 2>/dev/null || true
          shopt -s nullglob
          gh release upload "${{ github.ref_name }}" release/*.exe release/*.AppImage release/*.blockmap release/latest*.yml release/SHA256SUMS-*.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
